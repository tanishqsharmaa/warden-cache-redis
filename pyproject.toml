[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-cache-redis"
version = "1.0.0"
description = "Tier 1 Distributed Redis Sentinel Cache & Client Engine for Project Warden"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py312"

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: warden-storage
  labels:
    app: redis
    tier: storage
data:
  redis.conf: |
    # Memory & Eviction Directives
    maxmemory 512mb
    maxmemory-policy allkeys-lru

    # Persistence Directives
    appendonly yes
    appendfsync everysec
    no-appendfsync-on-rewrite yes
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb

    # Networking & Protocol Directives
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    protected-mode no

    # Security & Concurrency Directives
    maxclients 10000
    dir /data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: warden-storage
  labels:
    app: redis-sentinel
    tier: storage
data:
  sentinel.conf: |
    port 26379
    dir /tmp
    sentinel monitor mymaster redis-0.redis-headless.warden-storage.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 10000
    sentinel parallel-syncs mymaster 1
    protected-mode no
